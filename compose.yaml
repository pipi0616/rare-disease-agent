# The whole thing on one machine: `docker compose up --build`, then open
#
#   http://localhost:8501   the demo page
#   http://localhost:8000   the API (reference at /docs)
#   http://localhost:5050   MLflow: every request's trace, in the experiment "service"
#
# Three services from one image, as they would be three deployments: the API,
# a front end that only calls the API, and the tracking server the API reports
# to. Every port is published on 127.0.0.1 only — this machine, not the network.

services:
  api:
    build:
      context: .
      args:
        VERSION: ${VERSION:-unknown}
    image: raredx:local
    # The model API key, and any other setting, from .env — at run time, never in
    # the image. Without a .env the service starts and answers from the tools alone.
    env_file:
      - path: .env
        required: false
    environment:
      # A tracking server instead of a local file: the one setting that changes.
      RAREDX_MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  demo:
    image: raredx:local
    command: ["raredx", "demo", "--api-url", "http://api:8000", "--host", "0.0.0.0"]
    environment:
      HOME: /tmp  # Streamlit keeps a small settings folder; the image's user has no home
    ports:
      - "127.0.0.1:8501:8501"
    # The image's own check asks the API's port; this container runs the page.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  mlflow:
    image: raredx:local
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////app/state/mlflow.db
      - --artifacts-destination=/app/state/artifacts
      # The names the server is reached by: the API inside, the browser outside.
      - --allowed-hosts=mlflow:5000,localhost:5050,127.0.0.1:5050
    environment:
      MLFLOW_DISABLE_TELEMETRY: "true"
    volumes:
      - mlflow:/app/state
    ports:
      - "127.0.0.1:5050:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  mlflow:
