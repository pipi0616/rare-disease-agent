[project]
name = "raredx"
version = "1.1.0"
description = "Rare-disease diagnosis agent: clinical findings in, ranked diseases and genes with cited evidence out"
readme = "README.md"
authors = [
    { name = "pipi", email = "shaopeiye55@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.4",
    "fastembed>=0.9.0",
    "hpo3>=1.5.1",
    "httpx>=0.28.1",
    "httpx2>=2.12",
    "langchain>=1.4.3",
    "langchain-openai>=1.7.0",
    "mcp>=2.3.0",
    "mlflow>=3.17.0",
    "openai>=3.26.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.1",
    "rapidfuzz>=3",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
raredx = "raredx.cli:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
demo = [
    "streamlit>=1.65.0",
]
dev = [
    "ipykernel>=7.4.0",
    "mypy>=2.4.0",
    "nbconvert>=7.17.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
record = [
    "playwright>=1.64.0",
]

# `uv sync` and `uv run` install both groups: the demo page (Streamlit) is part of a
# working checkout. The container image leaves `dev` out.
[tool.uv]
default-groups = ["dev", "demo"]

# ── ruff: formatting + lint ──────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# The notebooks are teaching material with shell cells, not application code.
extend-exclude = ["docs/notebook"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes: unused imports, undefined names
    "I",       # import order
    "UP",      # modern syntax for the pinned Python version
    "B",       # likely bugs
    "C4",      # comprehension idioms
    "SIM",     # needless complexity
]

# ── mypy: static types. Strict from day one; the codebase is small enough. ──
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
ignore_missing_imports = true

# ── pytest ───────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra --strict-markers"
markers = [
    "llm: makes a billed model call",
    "network: hits an external service",
]
filterwarnings = [
    # Raised inside mlflow's SQLite store by its SQLAlchemy usage; not ours to fix.
    "ignore:The ``noload`` loader strategy:DeprecationWarning",
    # Raised inside mlflow's dataset digest by its pandas usage; not ours to fix.
    "ignore:Starting with pandas version 4.0:DeprecationWarning",
    "ignore:Starting with pandas version 4.0:FutureWarning",
]
