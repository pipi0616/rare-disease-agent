# Checks that run automatically before every commit (fast ones) and before
# every push (the test suite). Install once per clone:
#
#   uv run pre-commit install --hook-type pre-commit --hook-type pre-push
#
# Run everything by hand:  uv run pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
        # The demo's recording (scripts/record_demo.py) is the one deliberate exception:
        # a GIF of about 3 MB plays in the README, and an MP4 of about 2 MB. Data never.
        exclude: ^docs/img/demo-note\.(gif|mp4)$
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Notebooks are committed without outputs: outputs carry local paths and
  # data, and re-running a cell should not show up as a change.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  # mypy and pytest run from the project environment so they see the real
  # dependencies; the mirrors-mypy hook would run in an empty one.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src tests
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest (before push)
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
