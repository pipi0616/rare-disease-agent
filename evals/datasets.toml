# Every external dataset: the cases we evaluate on, and the knowledge the tools read.
#
# Code reads this file; no version, URL or checksum is written anywhere else.
# Adding a dataset is one entry here plus a parser. A new upstream release is a
# new version here, and its files land in a new folder — the old ones stay.
#
# `url` is the release folder. Each entry under `.files` is one file in it:
# downloaded from url + its name, and checked against the sha256 given.

[phenopacket-store]
version = "0.1.27"
url = "https://github.com/monarch-initiative/phenopacket-store/releases/download/0.1.27/"
homepage = "https://github.com/monarch-initiative/phenopacket-store"
license = "BSD-3-Clause"
role = "primary: design split for development, held-out split for the final run"

[phenopacket-store.files]
"all_phenopackets.zip" = "d0c70005bb09b87035087516252b6b539fbc0415be7c664b73c9cde7eedf205a"

# The store's main branch at a fixed commit, after the pinned release: the cases curated
# since (2026-10-07: 403 cases from 102 papers 0.1.27 does not have). Never read by a tool,
# never in the patient bank; the papers first public after the model's training cutoff
# make the temporal test (evals/splits.py). No release has them yet, so the commit is the pin.
[phenopacket-store-snapshot]
version = "85ffd78"
url = "https://github.com/monarch-initiative/phenopacket-store/archive/"
homepage = "https://github.com/monarch-initiative/phenopacket-store"
license = "BSD-3-Clause"
role = "evaluation: cases added after 0.1.27, for the temporal test"

[phenopacket-store-snapshot.files]
"85ffd78f3c17442a7dbb143df916ed6f8680066e.zip" = "18120cfd018d367080d065836ef16b55bdce077819083dce77fb2badd3a4569a"

# RareBench (Chen et al., KDD 2024): four public sets of patients as HPO terms and
# diagnoses, from other sources than Phenopacket Store. HMS (88 patients of a clinic at
# Hannover Medical School) and RAMEDIS (624, a registry of metabolic disease cases) make
# the external test; MME and LIRICAL come from published case reports, overlap the store's
# papers, and cannot be masked (docs/external_plan.md). Pinned to a dataset revision.
[rarebench]
version = "6f054e0"
url = "https://huggingface.co/datasets/chenxz/RareBench/resolve/6f054e04071953ef2c1779b279074245f2ab398c/"
