# Every external dataset: the cases we evaluate on, and the knowledge the tools read.
#
# Code reads this file; no version, URL or checksum is written anywhere else.
# Adding a dataset is one entry here plus a parser. A new upstream release is a
# new version here, and its files land in a new folder — the old ones stay.
#
# `url` is the release folder. Each entry under `.files` is one file in it:
# downloaded from url + its name, and checked against the sha256 given.

[phenopacket-store]
version = "0.1.27"
url = "https://github.com/monarch-initiative/phenopacket-store/releases/download/0.1.27/"
homepage = "https://github.com/monarch-initiative/phenopacket-store"
license = "BSD-3-Clause"
role = "primary: design split for development, held-out split for the final run"

[phenopacket-store.files]
"all_phenopackets.zip" = "d0c70005bb09b87035087516252b6b539fbc0415be7c664b73c9cde7eedf205a"

[hpo]
version = "v2026-09-01"
url = "https://github.com/obophenotype/human-phenotype-ontology/releases/download/v2026-09-01/"
homepage = "https://hpo.jax.org"
license = "HPO license: free to use, cite the version used; https://hpo.jax.org/license"
role = "knowledge: the ontology and disease annotations the phenotype tools read"

# The sha256 of each file as GitHub publishes it for the release's assets.
[hpo.files]
"hp.obo" = "93dace952fcb3ec4728818857f6ba76bc2d5312f4d83266519b8694b8e798f22"
"phenotype.hpoa" = "e89aa39c8f97bf5a52c5d160f9250a603681d630ade8ec2679d84ac5aece1f72"
"genes_to_phenotype.txt" = "507a17bff9c49e6329fbd88b1f91734fa7e9fdea5c06304044c0892eb6ab248c"
"genes_to_disease.txt" = "7937a1b92779dc8614e39ace623b443c7c71dd15e4de11d5e52b14e331ab5978"

# LIRICAL, an established phenotype-driven diagnosis tool, run on the same cases for
# comparison (src/raredx/baselines/lirical.py). The release as published: fetched and
# verified like a dataset, unpacked by `raredx data lirical`, never kept in git.
[lirical]
version = "2.4.1"
url = "https://github.com/TheJacksonLaboratory/LIRICAL/releases/download/v2.4.1/"
homepage = "https://thejacksonlaboratory.github.io/LIRICAL/"
license = "The Jackson Laboratory software license, non-commercial use only"
role = "comparison: a published diagnosis tool, given the same question, release and mask"

[lirical.files]
"lirical-cli-2.4.1-distribution.zip" = "445cd4975e46e6656b5ae2c04785548bbb4c434664c0423332d09bdffeb32248"

# The pinned HPO release in the format LIRICAL reads. Our own tools read hp.obo.
[hpo-json]
version = "v2026-09-01"
url = "https://github.com/obophenotype/human-phenotype-ontology/releases/download/v2026-09-01/"
homepage = "https://hpo.jax.org"
license = "HPO license: free to use, cite the version used; https://hpo.jax.org/license"
role = "comparison: the same ontology release, as JSON, for LIRICAL"

[hpo-json.files]
"hp.json" = "a7b3a012e7b4007a35a7cf8da35f2373b54cc16907f80d13d62470d31f833501"

# Disease texts for the RAG tool. Neither upstream versions its download URL
# (latest_only): the version is the release date the file states (Orphanet) or the
# day it was fetched (MedlinePlus), and a changed upstream file fails its checksum.
[orphanet]
version = "2026-06-23"
url = "https://www.orphadata.com/data/xml/"
homepage = "https://www.orphadata.com"
license = "CC BY 4.0; cite Orphanet (www.orpha.net)"
role = "knowledge: rare-disease definitions with their OMIM mappings, for text retrieval"
latest_only = true

[orphanet.files]
"en_product1.xml" = "df8d562a0c6011af36a74eb4000ce81ca7d723e8031010819fb71727c0962bbb"

# How rare each disease is: Orphanet's prevalence classes, from the same release as its
# definitions above. Analysis only — the results split by it; no tool reads it.
[orphanet-prevalence]
version = "2026-06-23"
url = "https://www.orphadata.com/data/xml/"
homepage = "https://www.orphadata.com"
license = "CC BY 4.0; cite Orphanet (www.orpha.net)"
role = "analysis: each disease's prevalence class, to split the held-out results by it"
latest_only = true

[orphanet-prevalence.files]
"en_product9_prev.xml" = "6b492b3cc61e5a0327de12f59386a07a071760a938d0bbd8f525bc4a5f71b7f0"

[medlineplus]
version = "2026-10-09"
url = "https://medlineplus.gov/download/"
homepage = "https://medlineplus.gov/genetics/"
license = "public domain; credit: Source: MedlinePlus, National Library of Medicine"
role = "knowledge: genetic-condition summaries with their OMIM keys, for text retrieval"
latest_only = true

[medlineplus.files]
"ghr-summaries.xml" = "fdc8bd614310c12718379cef6569962e5d0e791cecabcc355b53a72816ac263a"

# Text annotated with HPO terms by hand, to measure how well a note is read into terms
# (src/raredx/phenotyping). Evaluation only: read from the archive as downloaded, never
# unpacked, never in git, never shown to a tool.
#
# PhenoBERT's repository at a fixed commit: ID-68, 68 clinical notes (the test set), and
# 10 GeneReviews summaries (for development).
[phenobert]
version = "195d5df"
url = "https://github.com/EclipseCN/PhenoBERT/archive/"
homepage = "https://github.com/EclipseCN/PhenoBERT"
license = "MIT (the repository); the ID-68 notes were published by Anazi et al., Mol Psychiatry 2017"
role = "evaluation: ID-68 clinical notes (test) and GeneReviews summaries (development), with HPO annotations"

[phenobert.files]
"195d5df2ad9c6265e1de523f139694c7646eee29.zip" = "7d911190e40874320aabaae2fa3ae568fca27f4f1dbe06de4461f1fa5a9db435"

